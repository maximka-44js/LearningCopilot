x-db-environment: &x-db-environment
  POSTGRES_SSL_MODE: "disable"
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "db"
  POSTGRES_PASSWORD: "myAwEsOm3pa55@w0rd"
  POSTGRES_USER: "user"


x-backend-app-environment: &x-backend-app-environment
  GOMAXPROCS: "1"
  # App
  APP_NAME: "lc"
  APP_VERSION: "1.0.0"
  # HTTP settings
  HTTP_PORT: "8080"
  HTTP_USE_PREFORK_MODE: "false"
  # Logger
  LOG_LEVEL: "debug"
  # PG
  PG_POOL_MAX: "2"
  PG_URL: "postgres://user:myAwEsOm3pa55@w0rd@db:5432/db"
  # gRPC
  # RMQ
  # NATS
  # Metrics
  METRICS_ENABLED: "true"
  # Swagger
  SWAGGER_ENABLED: "true"
  # CORS
  CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS}"
  CORS_ALLOW_HEADERS: "${CORS_ALLOW_HEADERS}"
  CORS_ALLOW_METHODS: "${CORS_ALLOW_METHODS}"
  # S3 object storage
  S3_REGION_NAME: "${S3_REGION_NAME:-us-east-1}"
  S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
  S3_SECRET_KEY: "${S3_SECRET_KEY}"
  S3_BUCKET_NAME: "${S3_BUCKET_NAME}"
  S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-}"
  S3_PORT: "${S3_PORT:-443}"
  S3_USE_PATH_STYLE: "${S3_USE_PATH_STYLE:-true}"
  S3_PRESIGN_EXPIRE: "${S3_PRESIGN_EXPIRE:-15m}"
  # JWT
  JWT_ISSUER: "http://keycloak:8080/realms/lc"
  JWT_DISCOVERY_ISSUER: "http://keycloak:8080/realms/lc"
  JWT_CLIENT_ID: "lc-backend"

services:
  db:
    container_name: db
    image: postgres:16
    environment:
      <<: *x-db-environment
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      app_network:
        aliases:
          - db.lvh.me

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:25.0.6
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://keycloak-db:5432/keycloak"
      KC_DB_USERNAME: "keycloak"
      KC_DB_PASSWORD: "keycloak"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes.jar:/opt/keycloak/providers/keycloak-theme-for-kc-22-to-25.jar:ro
    ports:
      - "8082:8080"
    depends_on:
      - keycloak-db
    networks:
      app_network:
        aliases:
          - keycloak.lvh.me

  keycloak-db:
    container_name: keycloak-db
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: "keycloak"
      POSTGRES_USER: "keycloak"
      POSTGRES_PASSWORD: "keycloak"
    volumes:
      - keycloak_db_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    networks:
      app_network:
        aliases:
          - keycloak-db.lvh.me

  app:
    container_name: app
    platform: linux/amd64
    pid: "host"
    build:
      context: .
    environment:
      <<: *x-backend-app-environment
    ports:
      - "8080:8080"
    depends_on:
      - db
      - keycloak
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: '2Gb'
        reservations:
          cpus: '0.60'
          memory: '1Gb'
    networks:
      app_network:
        aliases:
          - app.lvh.me

  frontend-next:
    container_name: frontend-next
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "npm ci && npm run build && npm run start -- --hostname 0.0.0.0 --port 3000"
    environment:
      NODE_ENV: "production"
      NEXT_PUBLIC_API_BASE_URL: "http://app.lvh.me/v1/"
    volumes:
      - ../frontend:/app
      - frontend_next_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - app
      - keycloak
    expose:
      - "3000"
    networks:
      app_network:
        aliases:
          - frontend-next.lvh.me

  frontend-docs:
    container_name: frontend-docs
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "npm ci && npm run docs:build && npm run docs:preview -- --host 0.0.0.0 --port 4173"
    environment:
      NODE_ENV: "production"
    volumes:
      - ../docs:/app
      - frontend_docs_node_modules:/app/node_modules
    expose:
      - "4173"
    networks:
      app_network:
        aliases:
          - frontend-docs.lvh.me

  nginx:
    container_name: nginx
    image: nginx:1.31.0-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - app
      - frontend-next
      - frontend-docs
    networks:
      app_network:
        aliases:
          - nginx.lvh.me


networks:
  app_network:
    external: false


volumes:
  db_data:
    name: backend_db_data
  keycloak_db_data:
  frontend_next_node_modules:
  frontend_next_cache:
  frontend_docs_node_modules:
