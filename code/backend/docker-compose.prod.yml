x-db-environment: &x-db-environment
  POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
  POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set}"

x-backend-app-environment: &x-backend-app-environment
  GOMAXPROCS: "1"
  # App
  APP_NAME: "${APP_NAME:-lc}"
  APP_VERSION: "${APP_VERSION:-1.0.0}"
  # HTTP settings
  HTTP_PORT: "${APP_HTTP_PORT:-8080}"
  HTTP_USE_PREFORK_MODE: "false"
  # Logger
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  # PG
  PG_POOL_MAX: "2"
  PG_URL: "${PG_URL:?PG_URL must be set}"
  # Metrics
  METRICS_ENABLED: "true"
  # Swagger
  SWAGGER_ENABLED: "${SWAGGER_ENABLED:-false}"
  # CORS
  CORS_ALLOW_ORIGINS: "${PUBLIC_SCHEME:-https}://${PUBLIC_DOMAIN}"
  CORS_ALLOW_HEADERS: "${CORS_ALLOW_HEADERS:-Authorization, Content-Type}"
  CORS_ALLOW_METHODS: "${CORS_ALLOW_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}"
  # S3 object storage
  S3_REGION_NAME: "${S3_REGION_NAME:-us-east-1}"
  S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
  S3_SECRET_KEY: "${S3_SECRET_KEY}"
  S3_BUCKET_NAME: "${S3_BUCKET_NAME}"
  S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-}"
  S3_PORT: "${S3_PORT:-443}"
  S3_USE_PATH_STYLE: "${S3_USE_PATH_STYLE:-false}"
  S3_PRESIGN_EXPIRE: "${S3_PRESIGN_EXPIRE:-15m}"
  # JWT
  JWT_ISSUER: "${JWT_ISSUER:-http://keycloak:8080/realms/lc}"
  JWT_DISCOVERY_ISSUER: "${JWT_DISCOVERY_ISSUER:-http://keycloak:8080/realms/lc}"
  JWT_CLIENT_ID: "${JWT_CLIENT_ID:-lc-frontend}"

services:
  db:
    container_name: db
    image: postgres:16
    environment:
      <<: *x-db-environment
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      app_network:
        aliases:
          - db.lvh.me

  keycloak:
    container_name: keycloak
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    command: ["start", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be set}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "${KEYCLOAK_HTTP_ENABLED:-true}"
      KC_PROXY_HEADERS: "${KEYCLOAK_PROXY_HEADERS:-xforwarded}"
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://keycloak-db:5432/keycloak"
      KC_DB_USERNAME: "${KEYCLOAK_DB_USER:?KEYCLOAK_DB_USER must be set}"
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set}"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes.jar:/opt/keycloak/providers/keycloak-theme-for-kc-22-to-25.jar:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O-", "http://127.0.0.1:9000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      app_network:
        aliases:
          - keycloak.lvh.me

  keycloak-db:
    container_name: keycloak-db
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: "${KEYCLOAK_DB_NAME:?KEYCLOAK_DB_NAME must be set}"
      POSTGRES_USER: "${KEYCLOAK_DB_USER:?KEYCLOAK_DB_USER must be set}"
      POSTGRES_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set}"
    volumes:
      - keycloak_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      app_network:
        aliases:
          - keycloak-db.lvh.me

  migrate:
    container_name: migrate
    platform: linux/amd64
    restart: "no"
    build:
      context: .
    command: ["/migrate"]
    environment:
      PG_URL: "${PG_URL:?PG_URL must be set}"
      MIGRATIONS_PATH: "file:///migrations"
    depends_on:
      db:
        condition: service_healthy
    networks:
      app_network:
        aliases:
          - migrate.lvh.me

  app:
    container_name: app
    platform: linux/amd64
    pid: "host"
    restart: unless-stopped
    build:
      context: .
    environment:
      <<: *x-backend-app-environment
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "-O-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: '2Gb'
        reservations:
          cpus: '0.60'
          memory: '1Gb'
    networks:
      app_network:
        aliases:
          - app.lvh.me

  worker:
    container_name: worker
    platform: linux/amd64
    restart: unless-stopped
    build:
      context: .
    command: ["/worker"]
    environment:
      <<: *x-backend-app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      app_network:
        aliases:
          - worker.lvh.me

  frontend-next:
    container_name: frontend-next
    restart: unless-stopped
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${PUBLIC_SCHEME:-https}://api.${PUBLIC_DOMAIN}/v1/"
    environment:
      NODE_ENV: "production"
      NEXT_PUBLIC_API_BASE_URL: "${PUBLIC_SCHEME:-https}://api.${PUBLIC_DOMAIN}/v1/"
      AUTH_SECRET: "${FRONTEND_AUTH_SECRET}"
      AUTH_URL: "${PUBLIC_SCHEME:-https}://${PUBLIC_DOMAIN}"
      NEXTAUTH_URL: "${PUBLIC_SCHEME:-https}://${PUBLIC_DOMAIN}"
      AUTH_TRUST_HOST: "${FRONTEND_AUTH_TRUST_HOST:-true}"
      KEYCLOAK_ISSUER: "${PUBLIC_SCHEME:-https}://auth.${PUBLIC_DOMAIN}/realms/lc"
      KEYCLOAK_INTERNAL_ISSUER: "${FRONTEND_KEYCLOAK_ISSUER:-http://keycloak:8080/realms/lc}"
      KEYCLOAK_PUBLIC_ISSUER: "${PUBLIC_SCHEME:-https}://auth.${PUBLIC_DOMAIN}/realms/lc"
      KEYCLOAK_CLIENT_ID: "${FRONTEND_KEYCLOAK_CLIENT_ID:-lc-frontend}"
      KEYCLOAK_CLIENT_SECRET: "${FRONTEND_KEYCLOAK_CLIENT_SECRET}"
    depends_on:
      app:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      app_network:
        aliases:
          - frontend-next.lvh.me

  frontend-docs:
    container_name: frontend-docs
    restart: unless-stopped
    build:
      context: ../docs
      dockerfile: Dockerfile
    environment:
      NODE_ENV: "production"
    expose:
      - "4173"
    networks:
      app_network:
        aliases:
          - frontend-docs.lvh.me

  nginx:
    container_name: nginx
    image: nginx:1.31.0-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    environment:
      PUBLIC_DOMAIN: "${PUBLIC_DOMAIN:?PUBLIC_DOMAIN must be set in .env.prod}"
      NGINX_ENVSUBST_FILTER: "PUBLIC_DOMAIN"
    ports:
      - "${PROD_NGINX_HOST_PORT:-80}:80"
      - "${PROD_NGINX_HTTPS_HOST_PORT:-443}:443"
    depends_on:
      app:
        condition: service_started
      keycloak:
        condition: service_healthy
      frontend-next:
        condition: service_started
      frontend-docs:
        condition: service_started
    networks:
      app_network:
        aliases:
          - nginx.lvh.me


networks:
  app_network:
    external: false


volumes:
  db_data:
    name: backend_db_data
  keycloak_db_data:
